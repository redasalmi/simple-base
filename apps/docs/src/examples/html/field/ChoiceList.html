<fieldset class="sb-fieldset" aria-describedby="css-plan-description">
  <legend class="sb-field-title">Plan</legend>
  <p class="sb-field-description" id="css-plan-description">You can change it at any time.</p>
  <div class="sb-choice-list">
    <label class="sb-choice-list-item">
      <input class="sb-radio" type="radio" name="css-plan" value="starter" checked />
      <span>Starter</span>
    </label>
    <label class="sb-choice-list-item">
      <input class="sb-radio" type="radio" name="css-plan" value="team" />
      <span>Team</span>
    </label>
    <label class="sb-choice-list-item">
      <input class="sb-radio" type="radio" name="css-plan" value="enterprise" />
      <span>Enterprise</span>
    </label>
  </div>
</fieldset>
