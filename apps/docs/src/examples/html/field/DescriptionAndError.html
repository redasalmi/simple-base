<div class="sb-field">
  <label class="sb-field-label" for="css-client-email" data-required>Client email</label>
  <input
    class="sb-input"
    id="css-client-email"
    type="email"
    value="billing@"
    required
    aria-invalid="true"
    aria-describedby="css-client-email-description css-client-email-error"
  />
  <p class="sb-field-description" id="css-client-email-description">
    Invoices are sent to this address.
  </p>
  <p class="sb-field-error" id="css-client-email-error">
    Enter a full email address, like billing@example.com.
  </p>
</div>
