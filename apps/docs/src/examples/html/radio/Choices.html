<fieldset class="sb-fieldset preview-stack">
  <legend class="sb-heading-5">Row spacing</legend>

    <input class="sb-radio" type="radio" name="css-density" value="comfortable" checked />

  </label>
  <label class="preview-choice">
    <input class="sb-radio" type="radio" name="css-density" value="compact" />

</fieldset>
