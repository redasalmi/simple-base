name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and verify the packages without publishing them
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance attestations

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          # pnpm version comes from devEngines.packageManager in package.json.
          runtime: node@24
          cache: true
          require-lockfile: true # runs pnpm install --frozen-lockfile

      # No Turborepo cache here: a release is built and tested from scratch.

      # Never publish a release that fails lint, format, token, or type checks.
      - name: Run quality checks
        run: pnpm quality

      # The tests, the playground's axe check, and the smoke test all drive Playwright's Chromium.
      - name: Install Playwright Chromium
        run: pnpm --filter @simple-base/solid exec playwright install --with-deps --only-shell chromium

      - name: Run tests
        run: pnpm test

      # Packages ship compiled output from dist/, so build before packing. The contracts and solid
      # builds also run publint and attw on their packed tarballs.
      - name: Build packages
        run: pnpm build

      - name: Run smoke test
        run: pnpm test:smoke

      # Trusted publishing: pnpm trades this workflow's OIDC token for a short-lived npm token, so
      # no npm token is stored in the repository. Each package names this workflow as its trusted
      # publisher on npmjs.com. pnpm skips packages whose version is already on the registry, so
      # re-running this workflow is safe.
      - name: Publish packages
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=(--access public --no-git-checks)

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: packing and verifying without publishing"
            args+=(--dry-run)
          else
            args+=(--provenance)
          fi

          pnpm --filter './packages/*' -r publish "${args[@]}"
